# Publish Appstack Unity SDK: GitHub Release + signed OpenUPM package.
# Trigger: push a semantic version tag such as 1.0.0.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create release, package, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read tag version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package and wrapper versions
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts~/set-version.mjs --check "$TAG_VERSION"

      - name: Create root UPM package archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE_NAME="appstack-unity-sdk-${VERSION}"
          PACKAGE_ROOT="dist/${PACKAGE_NAME}"
          PACKAGE_ENTRIES=(
            package.json package.json.meta
            README.md README.md.meta
            CHANGELOG.md CHANGELOG.md.meta
            LICENSE.md LICENSE.md.meta
            USAGE.md USAGE.md.meta
            Runtime Runtime.meta
            Editor Editor.meta
            Tests Tests.meta
            "Samples~" "Documentation~"
          )

          mkdir -p "$PACKAGE_ROOT"
          for entry in "${PACKAGE_ENTRIES[@]}"; do
            if [[ ! -e "$entry" ]]; then
              echo "::error::Required package entry is missing: $entry"
              exit 1
            fi
            cp -R "$entry" "$PACKAGE_ROOT/"
          done

          # A -SNAPSHOT coordinate is mutable and expires, so a release must never
          # ship one: the published package would change under integrators, or stop
          # resolving altogether. Developing against a release candidate is fine —
          # the pin just has to be a plain release version by the time a tag is cut.
          # Scanning the assembled package covers the dependency declaration and any
          # setup documentation that names it, without a path list to keep in sync.
          if grep -rn -- '-SNAPSHOT' "$PACKAGE_ROOT"; then
            echo "::error::The package would ship a -SNAPSHOT native dependency (see matches above). Move the pin to a released version before tagging."
            exit 1
          fi

          (cd dist && zip -q -r "../${PACKAGE_NAME}.zip" "$PACKAGE_NAME")
          echo "package_name=${PACKAGE_NAME}.zip" >> "$GITHUB_ENV"
          echo "package_root=${PACKAGE_ROOT}" >> "$GITHUB_ENV"

      - name: Install pinned Unity UPM CLI
        env:
          UPM_CLI_VERSION: v9.32.0
          UPM_CLI_SHA256: 1de355a1bd5daf134a4dc7b6f97194e0db89cfedd0f98b5d8204603f7d009c21
        run: |
          archive="$RUNNER_TEMP/upm-linux-x64.zip"
          install_dir="$RUNNER_TEMP/upm-cli"
          curl -fsSL \
            "https://cdn.packages.unity.com/upm-cli/releases/${UPM_CLI_VERSION}/upm-linux-x64.zip" \
            -o "$archive"
          echo "${UPM_CLI_SHA256}  ${archive}" | sha256sum --check --strict -

          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/UnityPackageManager"
          ln -s UnityPackageManager "$install_dir/upm"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Pack and sign UPM package
        env:
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          missing=()
          [[ -z "$UPM_SERVICE_ACCOUNT_KEY_ID" ]] && missing+=(UPM_SERVICE_ACCOUNT_KEY_ID)
          [[ -z "$UPM_SERVICE_ACCOUNT_KEY_SECRET" ]] && missing+=(UPM_SERVICE_ACCOUNT_KEY_SECRET)
          [[ -z "$UPM_ORG_ID" ]] && missing+=(UPM_ORG_ID)
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "::error::Missing required UPM signing secrets: ${missing[*]}"
            exit 1
          fi

          upm pack "$package_root" \
            --organization-id "$UPM_ORG_ID" \
            --destination signed-dist

          mapfile -t signed_packages < <(find signed-dist -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#signed_packages[@]}" -ne 1 ]]; then
            echo "::error::Expected one signed .tgz, found ${#signed_packages[@]}"
            exit 1
          fi

          signed_package="${signed_packages[0]}"
          archive_entries="$(tar -tzf "$signed_package")"
          grep -qx 'package/package.json' <<< "$archive_entries"
          grep -qx 'package/.attestation.p7m' <<< "$archive_entries"

          actual_name="$(tar -xOzf "$signed_package" package/package.json | jq -r '.name')"
          actual_version="$(tar -xOzf "$signed_package" package/package.json | jq -r '.version')"
          if [[ "$actual_name" != 'com.appstack.unity-sdk' || "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Signed archive contains ${actual_name}@${actual_version}, expected com.appstack.unity-sdk@${EXPECTED_VERSION}"
            exit 1
          fi

          echo "signed_package=${signed_package}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body: |
            ## Appstack Unity SDK ${{ steps.version.outputs.version }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.

            ### Package authenticity

            The OpenUPM artifact is signed by Appstack through Unity's package-signing service. Unity 6.3 and newer can verify its publisher and integrity during installation.

            ### Install through Unity Package Manager

            1. Download and extract `appstack-unity-sdk-${{ steps.version.outputs.version }}.zip`.
            2. In Unity, open **Window → Package Manager**.
            3. Select **+ → Add package from disk** and choose the extracted root `package.json`.
            4. Complete the [iOS](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/Documentation~/iOS.md) and [Android](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/Documentation~/Android.md) setup.
          files: |
            ${{ env.package_name }}
            ${{ env.signed_package }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to OpenUPM
        uses: openupm/openupm-action@v1
        with:
          package: com.appstack.unity-sdk
          tag: ${{ github.ref_name }}
          timeout-minutes: 30
