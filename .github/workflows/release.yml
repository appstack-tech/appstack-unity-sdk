# Publish Appstack Unity SDK: GitHub Release + signed OpenUPM package.
#
# A stable release is a merge to main whose CHANGELOG.md has a new dated
# "## [X.Y.Z] - YYYY-MM-DD" section (see .github/scripts/resolve-release-version.sh).
# Merges that don't add one publish nothing. Day-to-day work lands on develop;
# the reviewed develop -> main PR is the release approval. This workflow creates
# the X.Y.Z tag itself. OpenUPM builds every version from its git tag, so no
# one should push version tags by hand (see RELEASING.md).
#
# Release candidates are not published: they are consumed from a develop commit.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Decides what this run publishes, before any build or check.
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed to tell a new version from one already released.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: meta
        run: .github/scripts/resolve-release-version.sh CHANGELOG.md

      # Fail here, not after the checks, when package.json or
      # Runtime/AppstackVersion.cs disagree with the changelog.
      - name: Check version copies agree
        if: ${{ steps.meta.outputs.release == 'true' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: node scripts~/set-version.mjs --check "$VERSION"

  # The same checks every PR ran.
  ci:
    name: CI
    needs: resolve
    if: ${{ needs.resolve.outputs.release == 'true' }}
    uses: ./.github/workflows/ci.yml

  release:
    name: Create release, package, and publish
    runs-on: ubuntu-latest
    needs: [resolve, ci]
    # Never run two publishes at once, and never cancel one in flight.
    concurrency:
      group: release-unity
      cancel-in-progress: false
    # The UPM signing secrets live in this environment, which only main can
    # deploy to, so a workflow run from any other branch can't read them.
    environment: release
    permissions:
      contents: write   # create the tag and GitHub Release
      id-token: write   # OpenUPM's OIDC-authenticated refresh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without --candidate this also rejects -SNAPSHOT coordinates and
      # non-release native pins.
      - name: Create root UPM package archive
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash scripts~/assemble-package.sh "$VERSION" >> "$GITHUB_ENV"

      - name: Install pinned Unity UPM CLI
        env:
          UPM_CLI_VERSION: v9.32.0
          UPM_CLI_SHA256: 1de355a1bd5daf134a4dc7b6f97194e0db89cfedd0f98b5d8204603f7d009c21
        run: |
          archive="$RUNNER_TEMP/upm-linux-x64.zip"
          install_dir="$RUNNER_TEMP/upm-cli"
          curl -fsSL \
            "https://cdn.packages.unity.com/upm-cli/releases/${UPM_CLI_VERSION}/upm-linux-x64.zip" \
            -o "$archive"
          echo "${UPM_CLI_SHA256}  ${archive}" | sha256sum --check --strict -

          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/UnityPackageManager"
          ln -s UnityPackageManager "$install_dir/upm"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Pack and sign UPM package
        env:
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          missing=()
          [[ -z "$UPM_SERVICE_ACCOUNT_KEY_ID" ]] && missing+=(UPM_SERVICE_ACCOUNT_KEY_ID)
          [[ -z "$UPM_SERVICE_ACCOUNT_KEY_SECRET" ]] && missing+=(UPM_SERVICE_ACCOUNT_KEY_SECRET)
          [[ -z "$UPM_ORG_ID" ]] && missing+=(UPM_ORG_ID)
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "::error::Missing required UPM signing secrets: ${missing[*]}"
            exit 1
          fi

          upm pack "$package_root" \
            --organization-id "$UPM_ORG_ID" \
            --destination signed-dist

          mapfile -t signed_packages < <(find signed-dist -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#signed_packages[@]}" -ne 1 ]]; then
            echo "::error::Expected one signed .tgz, found ${#signed_packages[@]}"
            exit 1
          fi

          signed_package="${signed_packages[0]}"
          archive_entries="$(tar -tzf "$signed_package")"
          grep -qx 'package/package.json' <<< "$archive_entries"
          grep -qx 'package/.attestation.p7m' <<< "$archive_entries"

          actual_name="$(tar -xOzf "$signed_package" package/package.json | jq -r '.name')"
          actual_version="$(tar -xOzf "$signed_package" package/package.json | jq -r '.version')"
          if [[ "$actual_name" != 'com.appstack.unity-sdk' || "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Signed archive contains ${actual_name}@${actual_version}, expected com.appstack.unity-sdk@${EXPECTED_VERSION}"
            exit 1
          fi

          echo "signed_package=${signed_package}" >> "$GITHUB_ENV"

      # The release notes lead with the CHANGELOG.md section, so the release
      # page stands on its own instead of pointing readers elsewhere.
      - name: Compose release notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts~/release-notes.mjs "$VERSION" --repo "$REPOSITORY" > "$notes"
          cat "$notes"
          echo "release_notes=${notes}" >> "$GITHUB_ENV"

      # --target creates the X.Y.Z tag on the merge commit just checked. Tags
      # created with GITHUB_TOKEN don't trigger workflows, so this can't start
      # another run. Re-runs after a later failure skip straight to OpenUPM.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping."
            exit 0
          fi
          gh release create "$VERSION" \
            "$package_name" "$signed_package" \
            --title "$VERSION" \
            --notes-file "$release_notes" \
            --generate-notes \
            --target "$TARGET_SHA" \
            --latest

      - name: Publish to OpenUPM
        uses: openupm/openupm-action@89b79dc8dd6cb319efff06727f8fa0051ce7e517 # v1
        with:
          package: com.appstack.unity-sdk
          tag: ${{ needs.resolve.outputs.version }}
          timeout-minutes: 30
